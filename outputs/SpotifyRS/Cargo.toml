[package]
name = "spotifyrs"
version = "0.1.1"
edition = "2021"
description = "Companion desktop experimental para Spotify Connect"
publish = false

[dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "accessibility"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
webbrowser = "1"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", features = ["rt-async-io-crypto-openssl"] }

[build-dependencies]
embed-resource = "3"
slint-build = "=1.18.1"

[patch.crates-io]
# Slint 1.18.1 with the Windows repaint fix from slint-ui/slint#13568.
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true


